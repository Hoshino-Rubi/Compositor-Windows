name: Windows native
on:
  push:
    paths: ['windows/**', 'Compositor/Rendering/*.c', 'Compositor/Rendering/*.h', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Compositor/Rendering/*.c', 'Compositor/Rendering/*.h', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            .tools/vcpkg
            .tools/onnxruntime
          key: native-x64-${{ hashFiles('windows/vcpkg.json', 'windows/dependencies.lock.json') }}
      - name: Prepare pinned decoders and ONNX runtime
        shell: pwsh
        run: ./windows/scripts/prepare-dependencies.ps1
      - name: Build and test C++ / Qt
        shell: pwsh
        run: ./windows/scripts/build.ps1 -QtDir "$env:QT_ROOT_DIR"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-native-tests
          path: windows/build-native/*tests.xml
      - name: Package native portable app
        shell: pwsh
        run: ./windows/scripts/package.ps1 -QtDir "$env:QT_ROOT_DIR" -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: windows/dist/*.zip
          if-no-files-found: error
